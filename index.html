<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>재미 단어 퀴즈</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app">
      <header>
        <h1>🎯 재미 단어 퀴즈</h1>
        <p>초등학교 5학년을 위한 영어 단어 게임</p>
      </header>

      <section class="status-card">
        <div><strong>점수:</strong> <span id="score">0</span></div>
        <div><strong>연속 정답:</strong> <span id="streak">0</span></div>
        <div><strong>현재 난이도:</strong> <span id="difficultyLabel">쉬움</span></div>
      </section>

      <section class="quiz-card" id="quizCard">
        <p class="question-title">이 단어의 뜻으로 가장 알맞은 것을 고르세요!</p>
        <h2 id="wordPrompt">ready</h2>
        <div id="choices" class="choices"></div>
        <p id="feedback" class="feedback" aria-live="polite"></p>
      </section>

      <section class="review-card">
        <h3>📝 틀린 단어 복습</h3>
        <p>틀린 단어를 모아 다시 풀어볼 수 있어요!</p>
        <button id="reviewBtn" disabled>복습 퀴즈 시작</button>
        <ul id="wrongWordList"></ul>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
